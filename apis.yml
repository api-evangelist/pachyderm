apis:
- name: Pachyderm gRPC API
  description: >-
    Pachyderm's platform API, exposed over gRPC/protobuf. Core services are PFS
    (data versioning — repos, commits, branches, files) and PPS (pipelines —
    jobs, datums, pipelines, logs), plus an Auth service (OIDC login, robot
    tokens, RBAC). Self-hosted on a Kubernetes cluster; there is no vendor-hosted
    public endpoint.
