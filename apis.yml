aid: pachyderm
name: Pachyderm
description: >-
  Pachyderm is an open-source (Apache-2.0) platform for data-centric pipelines
  and data versioning, widely used for MLOps. It provides immutable, git-like
  data lineage through the Pachyderm File System (PFS) and data-driven,
  containerized pipelines that reprocess only changed data through the
  Pachyderm Pipeline System (PPS), all running on Kubernetes. The platform is
  driven by a gRPC/protobuf API with first-party Python, Go, Ruby and Rust
  clients and the pachctl command-line tool. Pachyderm was acquired by Hewlett
  Packard Enterprise in January 2023; the standalone marketing, documentation
  and hosted (Pachyderm Hub) sites have since been retired, but the source,
  releases, SDKs and CLI remain actively published on GitHub and the language
  package registries (latest release v2.12.2, January 2025).
