description: >-
  First-party Pachyderm client libraries across languages. The gRPC/protobuf
  API is the source of truth; SDKs are generated/hand-maintained clients.
  pachyderm-sdk is the current official Python client; python-pachyderm is the
  legacy Python client (repo archived). Go client ships in the main module.
